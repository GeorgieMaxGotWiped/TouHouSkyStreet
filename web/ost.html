<body>
  <header class="site-header">
    <div class="container nav">
      <div class="nav-brand"><span class="dot"></span><span>东方天空街</span></div>
      <nav class="nav-links">
        <a href="index.html">首页</a>

  <section class="hero">
    <span class="kicker">Original Soundtrack</span>
    <h1>原声音乐</h1>
    <p class="lead">东方天空街 全曲目整理中，敬请期待。</p>
  </section>

  <section class="section">
    <div class="container">
      <div class="player reveal">
        <div class="player-art">♪</div>
        <div class="player-body">
          <div class="player-track">曲目整理中</div>
          <div class="player-sub">暂无上线曲目</div>
          <div class="player-progress"><span class="bar"></span></div>
          <div class="player-controls">
            <button class="ctrl" disabled title="上一首">⏮</button>
            <button class="ctrl play" disabled title="播放">▶</button>
            <button class="ctrl" disabled title="下一首">⏭</button>
          </div>
        </div>
      </div>

      <div class="section-head" style="margin-top:48px;">
        <h2>曲目列表</h2>
        <p>音乐文件仍在打磨，稍后释放</p>
      </div>
      <div class="track-list" id="track-list">
        <div class="track-empty">所有曲目整理中，敬请期待。🎵</div>
      </div>
    </div>
  </section>

  <footer class="site-footer">
